<svg xmlns="http://www.w3.org/2000/svg" width="590" height="360" viewBox="0 0 590 360">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#D06CC0"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.32"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="360" rx="22"/></clipPath><style>
