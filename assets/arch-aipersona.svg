<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#5B45E0"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.2"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient><clipPath id="c"><rect width="1200" height="760" rx="24"/></clipPath><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><style>
