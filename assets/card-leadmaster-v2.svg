<text x="28" y="138" class="f" font-size="15.5" fill="#A3A3B5">Researches every lead, writes a personalised email and sends</text><text x="28" y="161" class="f" font-size="15.5" fill="#A3A3B5">from several inboxes, with reply tracking and automatic</text><text x="28" y="184" class="f" font-size="15.5" fill="#A3A3B5">follow-ups. Running on real campaigns.</text>
