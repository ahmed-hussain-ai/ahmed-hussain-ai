<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070C"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B8CFF"/>
      <stop offset="0.5" stop-color="#7C6CF0"/>
      <stop offset="1" stop-color="#3BA4F0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E5AEE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6E5AEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3BA4F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3BA4F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D06CC0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D06CC0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse2 { animation: pulse 8s ease-in-out infinite reverse; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      .ring { animation: spin 40s linear infinite; transform-origin: 960px 160px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse class="pulse" cx="960" cy="160" rx="260" ry="200" fill="url(#glowA)"/>
  <ellipse class="pulse2" cx="1120" cy="60" rx="200" ry="160" fill="url(#glowB)"/>
  <ellipse class="pulse2" cx="140" cy="300" rx="260" ry="160" fill="url(#glowC)"/>

  <!-- avatar orb -->
  <g class="ring">
    <circle cx="960" cy="160" r="104" fill="none" stroke="url(#aurora)" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.7"/>
    <circle cx="1064" cy="160" r="5" fill="#9B8CFF"/>
    <circle cx="856" cy="160" r="4" fill="#3BA4F0"/>
  </g>
  <circle cx="960" cy="160" r="76" fill="#181822" stroke="url(#aurora)" stroke-width="2"/>
  <circle cx="960" cy="160" r="62" fill="url(#glowA)"/>
  <text x="960" y="178" text-anchor="middle" class="font" font-size="50" font-weight="800" fill="url(#aurora)">AH</text>

  <!-- copy -->
  <text x="72" y="96" class="font" font-size="15" font-weight="600" letter-spacing="4" fill="#9B8CFF">HI, I AM</text>
  <text x="72" y="160" class="font" font-size="60" font-weight="800" fill="#F5F5F8">Ahmed Hussain</text>
  <text x="72" y="206" class="font" font-size="26" font-weight="600" fill="url(#aurora)">AI Engineer · Agentic Systems · Voice &amp; Avatar AI</text>
  <text x="72" y="248" class="font" font-size="17" fill="#A3A3B5">I build AI agents, RAG systems and live voice avatars — and measure that they work.</text>
  <rect x="72" y="270" width="120" height="4" rx="2" fill="url(#aurora)"/>
</svg>
