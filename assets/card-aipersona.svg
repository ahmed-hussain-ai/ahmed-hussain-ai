<svg xmlns="http://www.w3.org/2000/svg" width="590" height="360" viewBox="0 0 590 360">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B8CFF"/><stop offset="1" stop-color="#5B45E0"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.32"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="590" height="360" rx="22"/></clipPath><style>
  .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .pulse { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pulse2 { animation: pulse 9s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  .spin { animation: spin 36s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .live { animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .rise { animation: rise .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style></defs>
